[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overlap-bot"
dynamic = ["version"]
description = "Discord bot that finds the time that works for everyone"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "pytz>=2023.3",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
bot = ["discord.py>=2.3.0"]
web = ["fastapi>=0.100.0", "uvicorn[standard]>=0.23.0"]
test = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["overlap*"]

[tool.setuptools.package-data]
overlap = ["data/*.json", "db/migrations/*.sql"]

[tool.setuptools.dynamic]
version = { attr = "overlap.__version__" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
