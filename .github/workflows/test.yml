name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: overlap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/overlap_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[bot,web,test]"

      - name: Install dbmate
        run: |
          curl -fsSL -o dbmate https://github.com/amacneil/dbmate/releases/download/v2.36.0/dbmate-linux-amd64
          chmod +x dbmate

      - name: Apply migrations
        run: ./dbmate up
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/overlap_test?sslmode=disable
          DBMATE_MIGRATIONS_DIR: overlap/db/migrations
          DBMATE_NO_DUMP_SCHEMA: "true"

      - name: Run tests
        run: pytest tests/ -v --tb=short
